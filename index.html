<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>С днем рождения, Влад!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="device" id="turntable" aria-label="Проигрыватель пластинок">
    <section class="deck">
      <div class="platter">
        <div class="vinyl" id="vinyl">
          <div class="vinyl-rotor">
            <div class="label">
              <div class="label-photo" role="img" aria-label="Фото Влада"></div>
              <div class="spindle"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="tonearm" aria-hidden="true">
        <div class="tonearm-base"></div>
        <div class="tonearm-arm">
          <div class="tonearm-head"></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-top">
        <p class="script-mark">vlad</p>
        <p class="model">record player</p>
      </div>

      <div class="greeting" id="greeting">
        <div class="greeting-text">
          <p class="greeting-title">С днём рождения, Влад!</p>
          <p>
            Желаю, чтобы семейная жизнь и дальше радовала и приносила счастье,
            чтобы с каждым годом семья становилась только крепче. Желаю терпения
            и успехов в поиске призвания. Родителям и Ксенону тоже мои поздравления!
          </p>
        </div>
      </div>

      <div class="speaker" aria-hidden="true"></div>

      <div class="panel-meta">
        <span class="display-time" id="displayTime">00:00</span>
        <span class="display-state" id="displayState">stop</span>
        <span class="display-rpm">33&#8531;</span>
      </div>

      <div class="controls">
        <div class="transport">
          <span class="key" aria-hidden="true"><span class="key-mark key-mark-prev"></span></span>
          <button class="power-btn" id="powerBtn" type="button" aria-pressed="false">
            <span class="power-face">
              <span class="icon icon-play" aria-hidden="true"></span>
              <span class="icon icon-stop" aria-hidden="true"></span>
            </span>
            <span class="power-label">
              <span class="label-on">play</span>
              <span class="label-off">stop</span>
            </span>
          </button>
          <span class="key" aria-hidden="true"><span class="key-mark key-mark-next"></span></span>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
